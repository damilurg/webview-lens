<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>webview-lens Open Graph image</title>
        <style>
            /* Rendered to public/og-image.png by `npm run og` (1200x630). Same palette as the site. */
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                background: #ffffff;
                color: #1f2328;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial,
                    sans-serif;
            }
            main {
                box-sizing: border-box;
                height: 100%;
                padding: 80px 88px;
                display: flex;
                flex-direction: column;
                border-top: 8px solid #0969da;
            }
            .name {
                font-size: 30px;
                font-weight: 600;
                color: #59636e;
            }
            h1 {
                margin: 28px 0 0;
                font-size: 60px;
                line-height: 1.15;
                font-weight: 600;
                letter-spacing: -0.5px;
            }
            p {
                margin: 28px 0 0;
                font-size: 28px;
                line-height: 1.45;
                color: #59636e;
                max-width: 960px;
            }
            .command {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }
            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 30px;
                padding: 10px 16px;
                border: 1px solid #d1d9e0;
                border-radius: 6px;
                background: #f6f8fa;
            }
            .platforms {
                font-size: 24px;
                color: #59636e;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="name">webview-lens</div>
            <h1>Debug the web page inside your mobile app</h1>
            <p>
                Chrome DevTools for Android WebView and iOS WKWebView, your localhost inside the
                app, logs, keyboard numbers and Web Vitals from a real phone.
            </p>
            <div class="command">
                <code>npx webview-lens devtools</code>
                <span class="platforms">macOS · Windows · Linux</span>
            </div>
        </main>
    </body>
</html>
