<!doctype html>
<!-- Source of site/public/og-image.png (1200×630). Re-render: npm run og (in site/). -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
                background: #0f1117;
                color: #e6e8ee;
            }
            .card {
                box-sizing: border-box;
                width: 1200px;
                height: 630px;
                padding: 72px 80px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                background:
                    radial-gradient(circle at 85% 20%, rgba(111, 66, 193, 0.45), transparent 45%),
                    radial-gradient(circle at 10% 90%, rgba(46, 164, 79, 0.25), transparent 40%);
            }
            .name {
                font-size: 40px;
                font-weight: 700;
                color: #b392f0;
                letter-spacing: -0.5px;
            }
            h1 {
                margin: 18px 0 0;
                font-size: 60px;
                line-height: 1.08;
                letter-spacing: -1.5px;
                font-weight: 800;
                max-width: 1000px;
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
            }
            .tag {
                font-size: 26px;
                padding: 10px 20px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.14);
            }
            .foot {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                font-size: 28px;
                color: #9aa1b2;
            }
            code {
                font-family: 'SF Mono', Menlo, Consolas, monospace;
                color: #e6e8ee;
                background: rgba(255, 255, 255, 0.08);
                padding: 6px 14px;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div>
                <div class="name">webview-lens</div>
                <h1>Debug Android WebView &amp; iOS WKWebView in Chrome DevTools</h1>
            </div>
            <div class="tags">
                <span class="tag">Fixed DevTools URL</span>
                <span class="tag">iOS on Windows</span>
                <span class="tag">localhost inside the app</span>
                <span class="tag">Web Vitals + CI budgets</span>
                <span class="tag">RUM + Prometheus</span>
            </div>
            <div class="foot">
                <code>npx webview-lens devtools</code>
                <span>macOS · Windows · Linux · MIT</span>
            </div>
        </div>
    </body>
</html>
