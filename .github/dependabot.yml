version: 2
updates:
    # The published package: dev tooling only (zero runtime dependencies).
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          dev-tooling:
              patterns: ['*']
    # The documentation website (site/): VitePress and Mermaid.
    - package-ecosystem: npm
      directory: /site
      schedule:
          interval: weekly
      groups:
          website:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
