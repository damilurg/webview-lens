name: pages
on:
    push:
        branches: [main]
        paths:
            - 'README.md'
            - 'CHANGELOG.md'
            - 'llms.txt'
            - 'package.json'
            - 'docs/**'
            - 'site/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  # Full history: page dates (Last updated, sitemap lastmod) come from git log.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: site/package-lock.json
            - uses: actions/configure-pages@v6
            - run: npm ci
              working-directory: site
            - run: npm run build
              working-directory: site
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site/.vitepress/dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
