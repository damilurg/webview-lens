name: release
on:
    push:
        tags:
            - 'v*'
permissions:
    contents: write
    id-token: write
    packages: write
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            # No dependency cache here: a poisoned cache entry could end up in the published package.
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
            - name: Tag matches package.json version
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi
            - run: npm ci
            - run: npm run verify
            - run: npm run bench
            # `prepack` builds dist/ once here; the GitHub Packages mirror below reuses it (--ignore-scripts).
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: GitHub Release from CHANGELOG
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  awk -v v="$version" '
                      $0 ~ "^## \\[" v "\\]" { found = 1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md > release-notes.md
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
            # Mirror to GitHub Packages (shown in the repo sidebar). It only accepts scoped names,
            # so the copy is @damilurg/webview-lens; npmjs.com stays the canonical registry.
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@damilurg'
                  package-manager-cache: false
            - name: Publish to GitHub Packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm pkg set name=@damilurg/webview-lens
                  npm pkg delete publishConfig
                  npm publish --ignore-scripts --registry https://npm.pkg.github.com
