name: ci
on:
    push:
        branches: [main]
    pull_request:
jobs:
    verify:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24, 26]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run verify
            - run: npm run build
            - run: npm run bench
